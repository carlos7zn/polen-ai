<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolenAI - Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">🐝</div>
                <h1>PolenAI</h1>
                <p class="subtitle">Chatbot con IA para la colmena</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Iniciar Sesión</button>
                <button class="tab-btn" data-tab="register">Registrarse</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Correo electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tu@ejemplo.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <div id="loginError" class="error-msg" style="display:none;"></div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerEmail">Correo electrónico</label>
                    <input type="email" id="registerEmail" placeholder="tu@ejemplo.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Contraseña</label>
                    <input type="password" id="registerPassword" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="registerName">Nombre (opcional)</label>
                    <input type="text" id="registerName" placeholder="¿Cómo te llamas?" autocomplete="nickname">
                </div>
                <div class="form-group">
                    <label for="registerInvite">Código de invitación</label>
                    <input type="text" id="registerInvite" placeholder="Te lo da el administrador" autocomplete="off">
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
                <div id="registerError" class="error-msg" style="display:none;"></div>
            </form>

            <div class="auth-footer">
                <p>Acceso restringido a miembros de la colmena</p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
