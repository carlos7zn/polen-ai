<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolenAI - Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🐝</div>
                    <span class="logo-text">PolenAI</span>
                </div>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nueva conversación
            </button>

            <div class="conversations-list" id="conversationsList">
                <!-- Conversations loaded dynamically -->
            </div>

            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Chat -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="chat-header-info">
                    <h2 id="currentTitle">PolenAI</h2>
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <div class="welcome-icon">🐝</div>
                    <h3>Hola, soy PolenAI</h3>
                    <p>¿En qué puedo ayudarte hoy? Puedo responder preguntas, ayudarte con código, escribir textos y mucho más.</p>
                    <div class="suggestion-chips">
                        <button class="chip" data-prompt="Explica de forma sencilla qué es una inteligencia artificial">¿Qué es la IA?</button>
                        <button class="chip" data-prompt="Ayúdame a escribir un email formal">Email formal</button>
                        <button class="chip" data-prompt="Dame 5 ideas de proyectos de programación">Proyectos</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <form id="chatForm" class="chat-input-form">
                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" required>
                    <button type="submit" class="send-btn" id="sendBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/chat.js"></script>
</body>
</html>
