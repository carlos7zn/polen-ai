<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolenAI - Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🐝</div>
                    <span class="logo-text">PolenAI</span>
                </div>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nueva conversación
            </button>

            <!-- Navigation links -->
            <nav class="sidebar-nav">
                <a href="/chat.html" class="nav-link active" id="navChat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Chat
                </a>
                <a href="/profile.html" class="nav-link" id="navProfile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Mi Perfil
                </a>
                <a href="/admin.html" class="nav-link" id="navAdmin" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                        <path d="M8 21h8"></path>
                        <path d="M12 17v4"></path>
                    </svg>
                    Admin
                </a>
            </nav>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nueva conversación
            </button>

            <div class="conversations-list" id="conversationsList">
                <!-- Conversations loaded dynamically -->
            </div>

            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Chat -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="chat-header-info">
                    <h2 id="currentTitle">PolenAI</h2>
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <div class="welcome-icon">🐝</div>
                    <h3>Hola, soy PolenAI</h3>
                    <p>¿En qué puedo ayudarte hoy? Puedo responder preguntas, ayudarte con código, escribir textos y mucho más.</p>
                    <div class="suggestion-chips">
                        <button class="chip" data-prompt="Explica de forma sencilla qué es una inteligencia artificial">¿Qué es la IA?</button>
                        <button class="chip" data-prompt="Ayúdame a escribir un email formal">Email formal</button>
                        <button class="chip" data-prompt="Dame 5 ideas de proyectos de programación">Proyectos</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <form id="chatForm" class="chat-input-form">
                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" required>
                    <button type="submit" class="send-btn" id="sendBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/chat.js"></script>
    <script>
        // Show/hide admin nav link based on admin status
        async function checkAdminStatus() {
            const token = localStorage.getItem('polen_token');
            if (!token) return;
            
            try {
                const res = await fetch('/api/profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.profile.is_admin) {
                        document.getElementById('navAdmin').style.display = 'flex';
                    }
                }
            } catch (err) {
                console.error('Admin check failed:', err);
            }
        }
        
        // Run after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAdminStatus);
        } else {
            checkAdminStatus();
        }
    </script>
    <script src="/js/chat.js"></script>
</body>
</html>
